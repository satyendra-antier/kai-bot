<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kai</title>
  <style>
    :root { color-scheme: light; --ink: #1c1915; --muted: #6b645c; --line: #e4ddd4; --paper: #f6f3ee; --accent: #0f6e56; --slate: #64748b; --rose: #9f1239; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 "Iowan Old Style", Palatino, Georgia, serif; color: var(--ink); background: var(--paper); }
    main { max-width: 720px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: white; }
    section { display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    header strong { font-size: 18px; }
    header .status { color: var(--muted); font-size: 13px; }
    header .status.busy { color: var(--accent); }
    header .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    header select, header button {
      font: 13px/1.2 ui-sans-serif, system-ui, sans-serif;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 8px 10px;
      cursor: pointer;
    }
    header #fresh { background: var(--accent); color: white; border-color: var(--accent); }
    #log { flex: 1; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 38rem; padding: 10px 12px; border: 1px solid var(--line); background: white; }
    .bubble.user { align-self: flex-end; background: #e7f3ef; }
    .bubble.user.pending { opacity: 0.85; }
    .bubble.typing { align-self: flex-start; background: #f8fafc; border-color: #cbd5e1; }
    .prompt-card { display: flex; flex-wrap: wrap; gap: 8px; }
    .prompt-card button { background: white; color: var(--ink); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; font: 14px/1 ui-sans-serif, sans-serif; }
    .prompt-card form { display: flex; flex-direction: column; gap: 8px; width: 100%; border: 0; padding: 0; }
    .who { display: block; font: 11px/1.2 ui-sans-serif, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .typing-row { display: flex; align-items: center; gap: 8px; }
    .typing-label { font: 13px/1.3 ui-sans-serif, sans-serif; color: var(--muted); }
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; height: 14px; }
    .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--slate); display: inline-block; animation: kai-typing 1.2s infinite ease-in-out; }
    .typing-dots i:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes kai-typing {
      0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing-dots i { animation: none; opacity: 0.7; }
    }
    .hint { margin: 8px 22px 0; color: var(--muted); font: 12px/1.4 ui-sans-serif, sans-serif; }
    .note { margin: 8px 22px 0; color: var(--rose); font: 12px/1.4 ui-sans-serif, sans-serif; }
    .empty { color: var(--muted); font-size: 14px; }
    form.composer { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--line); }
    form.composer input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); background: white; }
    form.composer button { font: 14px/1 ui-sans-serif, sans-serif; background: var(--accent); color: white; border: 0; padding: 0 16px; cursor: pointer; }
    form.composer button:disabled, form.composer input:disabled, .prompt-card button:disabled, header select:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <section>
      <header>
        <div class="brand">
          <strong id="title">Kai</strong>
          <span class="status" id="status">Online</span>
        </div>
        <div class="controls">
          <label>
            <span class="who" style="margin:0">Session</span>
            <select id="persona" aria-label="Chat session">
              <option value="guest">Guest · not signed in (onboarding)</option>
              <option value="logged_in:cust-thomas">Logged in · Thomas Reyes</option>
              <option value="logged_in:cust-amira">Logged in · Amira Shah</option>
            </select>
          </label>
          <button type="button" id="fresh">New chat</button>
        </div>
      </header>
      <p class="hint" id="session-hint">Guest has no account yet — money and balance asks route to onboarding. Logged in uses the demo ledger from the backoffice drafts.</p>
      <p class="note" id="note" hidden></p>
      <div id="log"></div>
      <form class="composer" id="form">
        <input id="text" autocomplete="off" placeholder="Top up my USD with €100 from EUR" />
        <button type="submit" id="send">Send</button>
      </form>
    </section>
  </main>
  <script>
    const key = "demo-key";
    const params = new URLSearchParams(location.search);
    const pinned = params.get("workflow") || "";
    const WAIT_MS = 45000;
    const log = document.querySelector("#log");
    const statusEl = document.querySelector("#status");
    const personaEl = document.querySelector("#persona");
    const textEl = document.querySelector("#text");
    const sendEl = document.querySelector("#send");
    const hintEl = document.querySelector("#session-hint");
    const noteEl = document.querySelector("#note");

    let waiting = false;
    let pendingText = "";
    let kaiCountAtWait = 0;
    let pollTimer = null;
    let waitTimer = null;
    let lastData = { messages: [], run: {}, live: {} };

    function parsePersona(value) {
      if (!value || value === "guest") return { persona: "guest", customer_id: "" };
      const [persona, customer_id = ""] = String(value).split(":");
      return { persona: persona || "guest", customer_id };
    }

    function storageKey() {
      return "kai-conv-" + (pinned || "demo") + "-" + (personaEl.value || "guest");
    }

    function freshId() {
      return "c-" + Date.now();
    }

    let id = sessionStorage.getItem(storageKey()) || "";
    if (!id) {
      id = freshId();
      sessionStorage.setItem(storageKey(), id);
    }

    if (pinned) {
      fetch("/v1/workflows/" + pinned, { headers: { "X-Api-Key": key } })
        .then((res) => res.ok ? res.json() : null)
        .then((row) => { if (row) document.querySelector("#title").textContent = row.name; })
        .catch(() => {});
    }

    function setNote(text) {
      if (!text) {
        noteEl.hidden = true;
        noteEl.textContent = "";
        return;
      }
      noteEl.hidden = false;
      noteEl.textContent = text;
    }

    function setBusy(next) {
      waiting = next;
      textEl.disabled = next;
      sendEl.disabled = next || !textEl.value.trim();
      sendEl.textContent = next ? "…" : "Send";
      textEl.placeholder = next ? "Kai is thinking…" : "Top up my USD with €100 from EUR";
      statusEl.textContent = next ? "Thinking…" : "Online";
      statusEl.classList.toggle("busy", next);
      personaEl.disabled = next;
      if (waitTimer) {
        clearTimeout(waitTimer);
        waitTimer = null;
      }
      if (next) {
        waitTimer = setTimeout(() => {
          if (!waiting) return;
          pendingText = "";
          setBusy(false);
          setNote("Kai is taking longer than usual. Keep this chat open — the reply may still arrive.");
          schedulePoll();
          paint();
        }, WAIT_MS);
      }
      schedulePoll();
    }

    function updateHint() {
      const { persona } = parsePersona(personaEl.value);
      hintEl.textContent = persona === "logged_in"
        ? "Logged in — Kai treats this chat as an opened individual account with the demo balances from workflow drafts."
        : "Guest — no account yet. Balance/money asks point to onboarding; say “onboarding” to start.";
    }

    function bubble(role, text, extraClass) {
      const el = document.createElement("div");
      el.className = "bubble " + role + (extraClass ? " " + extraClass : "");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "Kai";
      el.append(who);
      el.append(document.createTextNode(text));
      return el;
    }

    function typingBubble() {
      const el = document.createElement("div");
      el.className = "bubble typing";
      el.setAttribute("aria-live", "polite");
      el.setAttribute("aria-busy", "true");
      el.innerHTML = "<span class='who'>Kai</span><span class='typing-row'><span class='typing-dots' aria-hidden='true'><i></i><i></i><i></i></span><span class='typing-label'>Working on a reply…</span></span>";
      return el;
    }

    function promptCard(prompt) {
      const card = document.createElement("div");
      card.className = "prompt-card";
      (prompt.choices || []).forEach((choice) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = choice.label || choice.port;
        button.disabled = waiting;
        button.addEventListener("click", () => post(choice.label || choice.port));
        card.append(button);
      });
      const fields = prompt.fields || [];
      if (fields.length) {
        const form = document.createElement("form");
        fields.forEach((field) => {
          const input = document.createElement("input");
          input.name = field.id;
          input.placeholder = field.ask || field.id;
          input.type = field.type === "password" ? "password" : "text";
          input.disabled = waiting;
          form.append(input);
        });
        const button = document.createElement("button");
        button.type = "submit";
        button.textContent = "Send";
        button.disabled = waiting;
        form.append(button);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const body = [...form.querySelectorAll("input")].map((input) => input.value.trim()).filter(Boolean).join("\n");
          if (body) post(body);
        });
        card.append(form);
      }
      return card;
    }

    function kaiLines(data) {
      const known = new Set();
      const lines = [];
      (data.messages || []).forEach((row) => {
        if (row.role === "kai" && row.text && !known.has(row.text)) {
          known.add(row.text);
          lines.push(row.text);
        }
      });
      (((data.live && data.live.messages) || [])).forEach((line) => {
        const text = typeof line === "string" ? line : (line && line.text) || "";
        if (text && !known.has(text)) {
          known.add(text);
          lines.push(text);
        }
      });
      (((data.run && data.run.messages) || [])).forEach((row) => {
        const text = typeof row === "string" ? row : (row && row.text) || "";
        if (text && !known.has(text)) {
          known.add(text);
          lines.push(text);
        }
      });
      return lines;
    }

    function paint() {
      const data = lastData || { messages: [], run: {}, live: {} };
      const messages = data.messages || [];
      const kai = kaiLines(data);
      const knownKai = new Set((messages || []).filter((row) => row.role === "kai").map((row) => row.text));
      const nodes = messages.map((row) => bubble(row.role === "user" ? "user" : "kai", row.text));
      const pendingVisible = waiting && pendingText && !messages.some((row) => row.role === "user" && row.text === pendingText);
      if (pendingVisible) nodes.push(bubble("user", pendingText, "pending"));
      kai.filter((line) => !knownKai.has(line)).forEach((line) => nodes.push(bubble("kai", line)));
      if (waiting) nodes.push(typingBubble());
      const prompt = (data.run && data.run.prompt) || (data.live && data.live.prompt) || null;
      const fields = (prompt && prompt.fields) || [];
      const choices = (prompt && prompt.choices) || [];
      if (!waiting && prompt && (choices.length || fields.length)) nodes.push(promptCard(prompt));
      if (!nodes.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Ask Kai something. This chat follows the saved workflow drafts from the backoffice.";
        log.replaceChildren(empty);
      } else {
        log.replaceChildren(...nodes);
      }
      log.scrollTop = log.scrollHeight;
      if (waiting && kai.length > kaiCountAtWait) {
        pendingText = "";
        setNote("");
        setBusy(false);
        paint();
      }
    }

    async function post(text) {
      const body = String(text || "").trim();
      if (!body || waiting) return;
      const { persona, customer_id } = parsePersona(personaEl.value);
      pendingText = body;
      kaiCountAtWait = kaiLines(lastData).length;
      setNote("");
      setBusy(true);
      paint();
      try {
        const res = await fetch("/v1/conversations/" + id + "/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Api-Key": key },
          body: JSON.stringify({ text: body, workflow_id: pinned || null, persona, customer_id: customer_id || null }),
        });
        if (!res.ok) {
          const detail = await res.text();
          throw new Error(detail || ("HTTP " + res.status));
        }
        await refresh();
      } catch (err) {
        pendingText = "";
        setBusy(false);
        setNote("The message did not send. " + (err && err.message ? String(err.message).slice(0, 180) : "Try again."));
        paint();
      }
    }

    async function refresh() {
      try {
        const res = await fetch("/v1/conversations/" + id, { headers: { "X-Api-Key": key } });
        if (!res.ok) return;
        lastData = await res.json();
        paint();
        if (!waiting) {
          statusEl.textContent = "Online";
          statusEl.classList.remove("busy");
        }
      } catch (_) {}
    }

    function schedulePoll() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(refresh, waiting ? 400 : 1000);
    }

    function restart() {
      id = freshId();
      sessionStorage.setItem(storageKey(), id);
      pendingText = "";
      lastData = { messages: [], run: {}, live: {} };
      setNote("");
      setBusy(false);
      paint();
      refresh();
    }

    document.querySelector("#fresh").addEventListener("click", restart);
    personaEl.addEventListener("change", () => {
      updateHint();
      id = sessionStorage.getItem(storageKey()) || freshId();
      sessionStorage.setItem(storageKey(), id);
      pendingText = "";
      lastData = { messages: [], run: {}, live: {} };
      setNote("");
      setBusy(false);
      paint();
      refresh();
    });
    textEl.addEventListener("input", () => {
      sendEl.disabled = waiting || !textEl.value.trim();
    });
    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = textEl.value.trim();
      if (!text) return;
      textEl.value = "";
      sendEl.disabled = true;
      await post(text);
    });

    updateHint();
    schedulePoll();
    refresh();
  </script>
</body>
</html>
